      name="description"
      content="Ujjal Mondal — content creator, writer, actor and footballer from Kolkata. Watch my YouTube videos, read my stories and get in touch."
    />
    <title>Ujjal Mondal — Content Creator & Writer</title>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong mode
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
